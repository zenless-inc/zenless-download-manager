[package]
name = "zenless-dm"
version = "0.1.0"
edition = "2024"
description = "Zenless Download Manager - fast multi-connection downloads"
license = "MIT"
repository = "https://github.com/zenless-inc/zenless-download-manager"

[lib]
name = "zenless_dm"
path = "src/lib.rs"

[[bin]]
name = "zenless-dm"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36" }
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "charset", "system-proxy"] }
tiny_http = "0.12"
sha2 = "0.10"
percent-encoding = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3"
